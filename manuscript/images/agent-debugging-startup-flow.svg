<svg xmlns="http://www.w3.org/2000/svg" width="980" height="780" viewBox="0 0 980 780" role="img" aria-labelledby="title desc">
  <title id="title">Embabel Agent Startup Flow</title>
  <desc id="desc">Startup checkpoints from Starter dependency through agent deployment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4a5a"/>
    </marker>
    <style>
      .box { fill: #f8fbff; stroke: #3b4a5a; stroke-width: 2; rx: 8; }
      .label { fill: #17202a; font-family: Arial, Helvetica, sans-serif; font-size: 22px; }
      .small { fill: #405466; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
      .arrow { stroke: #3b4a5a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="210" y="30" width="560" height="58" class="box"/>
  <text x="490" y="66" text-anchor="middle" class="label">Starter dependency</text>

  <line x1="490" y1="88" x2="490" y2="124" class="arrow"/>
  <rect x="120" y="124" width="740" height="70" class="box"/>
  <text x="490" y="153" text-anchor="middle" class="label">Spring Boot imports Embabel auto-configurations</text>
  <text x="490" y="176" text-anchor="middle" class="small">model and platform auto-configuration are now on the boot path</text>

  <line x1="490" y1="194" x2="490" y2="230" class="arrow"/>
  <rect x="120" y="230" width="740" height="70" class="box"/>
  <text x="490" y="259" text-anchor="middle" class="label">Properties are loaded</text>
  <text x="490" y="282" text-anchor="middle" class="small">Embabel property files plus normal application properties</text>

  <line x1="490" y1="300" x2="490" y2="336" class="arrow"/>
  <rect x="120" y="336" width="740" height="70" class="box"/>
  <text x="490" y="365" text-anchor="middle" class="label">Spring binds Embabel configuration objects</text>
  <text x="490" y="388" text-anchor="middle" class="small">platform, model, scanning, tool, and runtime settings</text>

  <line x1="490" y1="406" x2="490" y2="442" class="arrow"/>
  <rect x="120" y="442" width="740" height="70" class="box"/>
  <text x="490" y="471" text-anchor="middle" class="label">Spring creates model, tool, platform, and @Agent beans</text>
  <text x="490" y="494" text-anchor="middle" class="small">Spring owns object construction and dependency injection</text>

  <line x1="490" y1="512" x2="490" y2="548" class="arrow"/>
  <rect x="120" y="548" width="740" height="70" class="box"/>
  <text x="490" y="577" text-anchor="middle" class="label">Embabel collects candidate agent beans</text>
  <text x="490" y="600" text-anchor="middle" class="small">bean post-processing records beans for later agent scanning</text>

  <line x1="490" y1="618" x2="490" y2="654" class="arrow"/>
  <rect x="120" y="654" width="740" height="70" class="box"/>
  <text x="490" y="683" text-anchor="middle" class="label">Metadata is read and agents are deployed</text>
  <text x="490" y="706" text-anchor="middle" class="small">@Agent, @Action, @Condition, and @AchievesGoal become platform metadata</text>
</svg>
